name: Build Android (APK & AAB)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Target ABIs (default: aarch64,armv7,x86_64)'
        required: false
        default: 'aarch64,armv7,x86_64'
        type: string

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB (Tauri v2)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config build-essential

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Setup Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          
          # Accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          # Ensure platform 35 and build-tools 35 are installed
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
          
          # Detect or install NDK 26.1.10909125
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            echo "Using existing NDK 26.1.10909125"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          else
            echo "Installing NDK 26.1.10909125..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

      - name: Make Gradlew Executable
        run: |
          chmod +x src-tauri/gen/android/gradlew

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          npm run build

      - name: Build Android APK (Tauri v2)
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          npx tauri android build --apk --ci

      - name: Build Android AAB Bundle (Tauri v2)
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        run: |
          npx tauri android build --aab --ci

      - name: List Generated Android Outputs
        run: |
          echo "=== Generated APK Files ==="
          find src-tauri/gen/android/app/build/outputs/apk -type f -name "*.apk" -exec ls -lh {} + || true
          echo "=== Generated AAB Bundle Files ==="
          find src-tauri/gen/android/app/build/outputs/bundle -type f -name "*.aab" -exec ls -lh {} + || true

      - name: Upload Android APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allama-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: Upload Android AAB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allama-android-aab
          path: src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          draft: false
          prerelease: false
          generate_release_notes: true
