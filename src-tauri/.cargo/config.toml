# Cross-compilation settings for the Android NDK (Phase 5).
#
# `tauri android init` installs the NDK and prepends its toolchain to PATH; the
# linker names below are the ones the NDK ships. Set NDK_HOME to the installed
# NDK (usually $ANDROID_HOME/ndk/<version>) if your NDK is not auto-detected.
#
# Desktop builds ignore these target sections entirely.

[target.aarch64-linux-android]
ar = "llvm-ar"
linker = "aarch64-linux-android-clang"

[target.armv7-linux-androideabi]
ar = "llvm-ar"
linker = "armv7a-linux-androideabi-clang"

[target.i686-linux-android]
ar = "llvm-ar"
linker = "i686-linux-android-clang"

[target.x86_64-linux-android]
ar = "llvm-ar"
linker = "x86_64-linux-android-clang"
