<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Aura -->
    <linearGradient id="bg-aura-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.04" />
    </linearGradient>

    <!-- Card 1 Gradient (Back - Indigo) -->
    <linearGradient id="card-grad-back" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>

    <!-- Card 2 Gradient (Middle - Vibrant Cyan/Teal) -->
    <linearGradient id="card-grad-mid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0E7490" />
    </linearGradient>

    <!-- Card 3 Gradient (Front - Glowing Violet/Purple) -->
    <linearGradient id="card-grad-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="60%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Glowing Bulb Gradient -->
    <linearGradient id="bulb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>

    <!-- Gold Pill -->
    <linearGradient id="gold-pill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="soft-shadow-2" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.22" />
    </filter>
    <filter id="glow-bulb" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#FACC15" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow & Intersecting Circles -->
  <circle cx="250" cy="200" r="175" fill="url(#bg-aura-2)" />
  <circle cx="160" cy="130" r="85" fill="#8B5CF6" fill-opacity="0.06" />
  <circle cx="350" cy="270" r="95" fill="#EC4899" fill-opacity="0.05" />

  <!-- Intersecting Geometric Synapse Lines -->
  <path d="M 80 180 Q 200 80 320 180 T 420 160" fill="none" stroke="#C084FC" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.4" />
  <path d="M 100 240 Q 240 330 380 230" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 8" stroke-opacity="0.3" />

  <!-- 1. Back Layer Flashcard (Rotated Right) -->
  <g transform="translate(285, 120) rotate(15)" filter="url(#soft-shadow-2)">
    <rect x="-85" y="-115" width="170" height="230" rx="18" fill="url(#card-grad-back)" stroke="#6366F1" stroke-width="2" />
    <!-- Back card content lines -->
    <rect x="-65" y="-90" width="70" height="12" rx="6" fill="#A5B4FC" fill-opacity="0.6" />
    <circle cx="55" cy="-84" r="10" fill="#FFFFFF" fill-opacity="0.2" />
    <rect x="-65" y="-60" width="130" height="70" rx="10" fill="#FFFFFF" fill-opacity="0.12" />
    <rect x="-65" y="25" width="100" height="8" rx="4" fill="#A5B4FC" fill-opacity="0.5" />
    <rect x="-65" y="42" width="75" height="8" rx="4" fill="#A5B4FC" fill-opacity="0.5" />
  </g>

  <!-- 2. Middle Layer Flashcard (Rotated Left) -->
  <g transform="translate(195, 140) rotate(-14)" filter="url(#soft-shadow-2)">
    <rect x="-85" y="-115" width="170" height="230" rx="18" fill="url(#card-grad-mid)" stroke="#22D3EE" stroke-width="2" />
    <!-- Middle card design -->
    <rect x="-65" y="-90" width="55" height="12" rx="6" fill="#A5F3FC" fill-opacity="0.7" />
    <rect x="-65" y="-60" width="130" height="60" rx="10" fill="#FFFFFF" fill-opacity="0.15" />
    <!-- Circular progress ring inside mid card -->
    <circle cx="0" cy="40" r="22" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="5" fill="none" />
    <path d="M 0 18 A 22 22 0 1 1 -20 48" stroke="#FDE047" stroke-width="5" stroke-linecap="round" fill="none" />
    <text x="0" y="44" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">75%</text>
  </g>

  <!-- 3. Front Main Interactive Flashcard (Centered & Upright with slight tilt) -->
  <g transform="translate(245, 195) rotate(-2)" filter="url(#soft-shadow-2)">
    <rect x="-95" y="-125" width="190" height="250" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Top Card Color Header Banner -->
    <path d="M -95 -103 C -95 -115 -85 -125 -73 -125 L 73 -125 C 85 -125 95 -115 95 -103 L 95 -45 L -95 -45 Z" fill="url(#card-grad-front)" />
    
    <!-- Subject Chip on Card -->
    <rect x="-80" y="-112" width="65" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.25" />
    <text x="-48" y="-99" fill="#FFFFFF" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">FLASHCARD</text>
    <circle cx="75" cy="-103" r="6" fill="#10B981" />
    <path d="M 72.5 -103 L 74.5 -101 L 77.5 -105" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none" />

    <!-- Card Prompt Title Question -->
    <rect x="-75" y="-25" width="150" height="12" rx="6" fill="#1E293B" />
    <rect x="-75" y="-5" width="115" height="9" rx="4.5" fill="#64748B" />

    <!-- Smart Formula / Concept Visual Box inside card -->
    <rect x="-75" y="20" width="150" height="65" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    
    <!-- Audio pronounce wave inside flashcard -->
    <g transform="translate(-55, 52)">
      <circle cx="0" cy="0" r="14" fill="#EEF2FF" />
      <polygon points="-4,-6 3,0 -4,6" fill="#6366F1" />
    </g>
    <rect x="-32" y="45" width="90" height="6" rx="3" fill="#6366F1" />
    <rect x="-32" y="56" width="60" height="5" rx="2.5" fill="#94A3B8" />

    <!-- Memorized / Mastery Toggle Buttons at Bottom of Front Card -->
    <rect x="-75" y="96" width="70" height="20" rx="10" fill="#DCFCE7" />
    <text x="-40" y="110" fill="#15803D" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">✓ حفظتها</text>

    <rect x="5" y="96" width="70" height="20" rx="10" fill="#FEF3C7" />
    <text x="40" y="110" fill="#B45309" font-size="9" font-weight="bold" font-family="sans-serif" text-anchor="middle">⟳ مراجعة</text>
  </g>

  <!-- 4. Intersecting Element: Glowing Creative Lightbulb (Top Right Overlapping Cards) -->
  <g transform="translate(365, 85)" filter="url(#glow-bulb)">
    <!-- Aura Rays -->
    <line x1="0" y1="-28" x2="0" y2="-38" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="-20" x2="28" y2="-28" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="28" y1="0" x2="38" y2="0" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="-20" x2="-28" y2="-28" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    <line x1="-28" y1="0" x2="-38" y2="0" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" />
    
    <!-- Bulb Glass Dome -->
    <path d="M -20 -4 C -20 -18 -8 -26 0 -26 C 8 -26 20 -18 20 -4 C 20 8 12 16 10 22 L -10 22 C -12 16 -20 8 -20 -4 Z" fill="url(#bulb-grad)" />
    <!-- Filament Heart -->
    <path d="M -6 -4 Q 0 -14 6 -4 T 0 10" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
    <!-- Screw Base -->
    <rect x="-9" y="22" width="18" height="5" rx="2" fill="#94A3B8" />
    <rect x="-8" y="28" width="16" height="4" rx="2" fill="#64748B" />
    <polygon points="-5,32 5,32 0,36" fill="#475569" />
  </g>

  <!-- 5. Intersecting Element: +50 XP Gamification Floating Badge (Bottom Left) -->
  <g transform="translate(115, 290)" filter="url(#soft-shadow-2)">
    <rect x="-35" y="-18" width="85" height="36" rx="18" fill="url(#gold-pill)" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="-16" cy="0" r="11" fill="#FFFFFF" fill-opacity="0.3" />
    <text x="-16" y="4" fill="#FFFFFF" font-size="12" font-weight="bold" font-family="sans-serif" text-anchor="middle">★</text>
    <text x="14" y="5" fill="#FFFFFF" font-size="12" font-weight="900" font-family="sans-serif" text-anchor="middle">+50 XP</text>
  </g>

  <!-- 6. Floating Concept Brain Pulse Ribbon (Bottom Center Intersecting) -->
  <g transform="translate(365, 305)" filter="url(#soft-shadow-2)">
    <rect x="-40" y="-15" width="85" height="32" rx="16" fill="#1E293B" stroke="#8B5CF6" stroke-width="2" />
    <circle cx="-22" cy="1" r="5" fill="#10B981" />
    <text x="7" y="6" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">إتقان 100%</text>
  </g>

  <!-- Sparkling Stars -->
  <path d="M 120 70 L 123 78 L 131 81 L 123 84 L 120 92 L 117 84 L 109 81 L 117 78 Z" fill="#F59E0B" />
  <path d="M 410 220 L 412 226 L 418 228 L 412 230 L 410 236 L 408 230 L 402 228 L 408 226 Z" fill="#8B5CF6" />
</svg>
