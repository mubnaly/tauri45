<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Aura -->
    <linearGradient id="bg-aura-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.14" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.04" />
    </linearGradient>

    <!-- Golden Trophy Gradient -->
    <linearGradient id="trophy-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Trophy Inner Cup Shadow Gradient -->
    <linearGradient id="trophy-inner" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Podium Gradients -->
    <linearGradient id="podium-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="podium-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="podium-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Certificate Ribbon -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>

    <filter id="soft-shadow-3" x="-15%" y="-15%" width="135%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.2" />
    </filter>
    <filter id="glow-gold" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F59E0B" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="250" cy="200" r="175" fill="url(#bg-aura-3)" />
  <circle cx="340" cy="140" r="90" fill="#F59E0B" fill-opacity="0.06" />
  <circle cx="150" cy="180" r="85" fill="#10B981" fill-opacity="0.05" />

  <!-- Confetti / Particle Stream in background -->
  <rect x="110" y="70" width="8" height="8" rx="2" fill="#F43F5E" transform="rotate(25 110 70)" />
  <rect x="380" y="80" width="10" height="6" rx="2" fill="#10B981" transform="rotate(-35 380 80)" />
  <rect x="420" y="160" width="8" height="8" rx="2" fill="#3B82F6" transform="rotate(45 420 160)" />
  <circle cx="95" cy="190" r="4" fill="#F59E0B" />
  <circle cx="390" cy="260" r="4" fill="#8B5CF6" />

  <!-- 1. Intersecting Element: 100% Exam Paper / Certificate (Tilted in Background Left) -->
  <g transform="translate(170, 150) rotate(-12)" filter="url(#soft-shadow-3)">
    <!-- Sheet of Paper -->
    <rect x="-70" y="-100" width="140" height="190" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
    
    <!-- Top Decorative Line -->
    <rect x="-50" y="-80" width="100" height="8" rx="4" fill="#6366F1" />
    <rect x="-50" y="-62" width="60" height="6" rx="3" fill="#94A3B8" />

    <!-- Exam Question Item 1 with Green Checkmark -->
    <circle cx="-42" cy="-35" r="7" fill="#DCFCE7" />
    <path d="M -45 -35 L -43 -33 L -39 -37" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <rect x="-28" y="-38" width="65" height="5" rx="2.5" fill="#64748B" />

    <!-- Exam Question Item 2 with Green Checkmark -->
    <circle cx="-42" cy="-12" r="7" fill="#DCFCE7" />
    <path d="M -45 -12 L -43 -10 L -39 -14" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <rect x="-28" y="-15" width="55" height="5" rx="2.5" fill="#64748B" />

    <!-- Exam Question Item 3 with Green Checkmark -->
    <circle cx="-42" cy="11" r="7" fill="#DCFCE7" />
    <path d="M -45 11 L -43 13 L -39 9" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" fill="none" />
    <rect x="-28" y="8" width="70" height="5" rx="2.5" fill="#64748B" />

    <!-- Red Grade Stamp: A+ 100/100 -->
    <g transform="translate(30, 48) rotate(-8)">
      <circle cx="0" cy="0" r="22" stroke="#DC2626" stroke-width="2" stroke-dasharray="3 2" fill="#FEF2F2" fill-opacity="0.9" />
      <text x="0" y="2" fill="#DC2626" font-size="14" font-weight="900" font-family="sans-serif" text-anchor="middle">A+</text>
      <text x="0" y="14" fill="#DC2626" font-size="7" font-weight="bold" font-family="sans-serif" text-anchor="middle">100/100</text>
    </g>
  </g>

  <!-- 2. Leaderboard Podium (Base Intersecting) -->
  <g transform="translate(250, 310)" filter="url(#soft-shadow-3)">
    <!-- Rank 2 Podium (Left) -->
    <rect x="-120" y="0" width="70" height="55" rx="8" fill="url(#podium-2)" />
    <text x="-85" y="32" fill="#FFFFFF" font-size="20" font-weight="900" font-family="sans-serif" text-anchor="middle">2</text>
    <rect x="-105" y="40" width="40" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- Rank 3 Podium (Right) -->
    <rect x="50" y="15" width="70" height="40" rx="8" fill="url(#podium-3)" />
    <text x="85" y="42" fill="#FFFFFF" font-size="18" font-weight="900" font-family="sans-serif" text-anchor="middle">3</text>

    <!-- Rank 1 Main Center Podium -->
    <rect x="-45" y="-20" width="90" height="75" rx="10" fill="url(#podium-1)" stroke="#60A5FA" stroke-width="2" />
    <text x="0" y="18" fill="#FFFFFF" font-size="28" font-weight="900" font-family="sans-serif" text-anchor="middle">1</text>
    <text x="0" y="38" fill="#FDE047" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle">★ الأوائل ★</text>
  </g>

  <!-- 3. Central Majestic Golden Trophy (Prominently Overlapping All Layers) -->
  <g transform="translate(250, 165)" filter="url(#glow-gold)">
    <!-- Trophy Left Ear / Handle -->
    <path d="M -35 -30 C -68 -30 -68 15 -32 20 L -30 10 C -52 8 -52 -18 -30 -18 Z" fill="url(#trophy-gold)" stroke="#B45309" stroke-width="1.5" />
    
    <!-- Trophy Right Ear / Handle -->
    <path d="M 35 -30 C 68 -30 68 15 32 20 L 30 10 C 52 8 52 -18 30 -18 Z" fill="url(#trophy-gold)" stroke="#B45309" stroke-width="1.5" />

    <!-- Trophy Main Cup Body -->
    <path d="M -38 -45 L 38 -45 C 38 -5 32 28 0 42 C -32 28 -38 -5 -38 -45 Z" fill="url(#trophy-gold)" stroke="#D97706" stroke-width="1.5" />
    
    <!-- Cup Inner Opening Rim -->
    <ellipse cx="0" cy="-45" rx="38" ry="10" fill="url(#trophy-inner)" />
    <ellipse cx="0" cy="-46" rx="35" ry="8" fill="url(#trophy-gold)" />

    <!-- Golden Star Emblem embossed on Cup -->
    <path d="M 0 -14 L 3.5 -5 L 12 -4 L 6 3 L 8 12 L 0 7.5 L -8 12 L -6 3 L -12 -4 L -3.5 -5 Z" fill="#FFFFFF" filter="url(#soft-shadow-3)" />

    <!-- Trophy Stem / Neck -->
    <path d="M -8 40 L 8 40 L 6 65 L -6 65 Z" fill="url(#trophy-gold)" />
    
    <!-- Trophy Connector Node -->
    <circle cx="0" cy="67" r="9" fill="url(#trophy-gold)" />

    <!-- Trophy Base Pedestal -->
    <polygon points="-28,88 28,88 22,76 -22,76" fill="#78350F" />
    <rect x="-35" y="88" width="70" height="24" rx="5" fill="#1E293B" stroke="#D97706" stroke-width="1.5" />
    
    <!-- Plaque on Trophy Base -->
    <rect x="-24" y="94" width="48" height="12" rx="3" fill="url(#trophy-gold)" />
    <text x="0" y="103" fill="#78350F" font-size="7.5" font-weight="900" font-family="sans-serif" text-anchor="middle">CHAMPION</text>
  </g>

  <!-- 4. Intersecting Element: Laurel Wreath of Excellence (Flanking Trophy) -->
  <!-- Left Laurel Leaf Branch -->
  <g fill="#10B981" fill-opacity="0.9" filter="url(#soft-shadow-3)">
    <ellipse cx="180" cy="180" rx="9" ry="4" transform="rotate(-30 180 180)" />
    <ellipse cx="185" cy="155" rx="9" ry="4" transform="rotate(-15 185 155)" />
    <ellipse cx="195" cy="132" rx="9" ry="4" transform="rotate(10 195 132)" />
  </g>
  <!-- Right Laurel Leaf Branch -->
  <g fill="#10B981" fill-opacity="0.9" filter="url(#soft-shadow-3)">
    <ellipse cx="320" cy="180" rx="9" ry="4" transform="rotate(30 320 180)" />
    <ellipse cx="315" cy="155" rx="9" ry="4" transform="rotate(15 315 155)" />
    <ellipse cx="305" cy="132" rx="9" ry="4" transform="rotate(-10 305 132)" />
  </g>

  <!-- 5. Intersecting Element: Instant AI Evaluation & Top Score Badge (Top Right) -->
  <g transform="translate(365, 80)" filter="url(#soft-shadow-3)">
    <rect x="-42" y="-18" width="95" height="36" rx="18" fill="#1E293B" stroke="#10B981" stroke-width="2" />
    <circle cx="-22" cy="0" r="10" fill="#10B981" />
    <path d="M -26 0 L -23 3 L -18 -3" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" />
    <text x="14" y="5" fill="#FFFFFF" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle">تصحيح فوري</text>
  </g>

  <!-- Floating Golden Sparkles -->
  <path d="M 250 55 L 253 65 L 263 68 L 253 71 L 250 81 L 247 71 L 237 68 L 247 65 Z" fill="#FDE047" />
  <path d="M 125 110 L 127 116 L 133 118 L 127 120 L 125 126 L 123 120 L 117 118 L 123 116 Z" fill="#F59E0B" />
</svg>
