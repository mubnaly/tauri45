    <link rel="icon" type="image/png" href="assets/icon/favicon.png"/>    <!--
        Do NOT turn this back into a plain blocking <link rel="stylesheet">.

        Chromium defers the execution of every <script> that follows a style sheet which
        is still loading. googleapis.com is not always reachable (it is frequently slow
        or blocked), and when this request hangs the HTML parser never reaches <body>:
        Angular never boots, cordova's onDOMContentLoaded/deviceready never fire and the
        app sits on a white screen after the splash for as long as the request is pending.
        Loading it with rel="preload" keeps the fonts when the request succeeds while
        never blocking the parser.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""/>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Pacifico&amp;family=Reem+Kufi:wght@400;700&amp;display=swap" onload="this.onload=null;this.rel='stylesheet'"/>
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Reem+Kufi:wght@400;700&display=swap"
            rel="stylesheet" />
    </noscript>

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black"/>

    <!--
        Do NOT add <script src="cordova.js"></script> back here.

        Capacitor injects the Cordova runtime itself (JSExport.getCordovaJS reads
        assets/public/cordova.js and JSInjector inserts it right after <head>), so the
        tag is redundant. It is also fatal: WebViewLocalServer.handleLocalRequest answers
        any request for /cordova.js with an empty response (null body), so a blocking
        <script src="cordova.js"> never completes loading and the HTML parser stalls on
        it forever. The page never reaches <body>, Angular never boots, cordova's
        onDOMContentLoaded channel never fires (so deviceready never fires) and the app
        is stuck on a white screen after the splash.
    -->
    <script src="assets/lib/mathjax/MathJax.js?delayStartupUntil=configured"></script>
